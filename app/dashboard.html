<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início |EcoCollect</title>
    <link rel="stylesheet" href="style.css/dashboard.css">
</head>
<body>
    <header>
    <div class="logo-container"></div>
        <h1>EcoCollect</h1>
        <span>by Ambientify</span>
    </div>
        <nav class = "menu">
            <a class="Pagina-inicial" href="index.html">Início</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="">Cadastro</a>
            <a href="coletas.html">Coletas</a>
        </nav>
    </header>
    <div class="usuario">
        <div class="foto-perfil">
            <img 
            src="img/foto-perfil.png" 
            alt="foto de perfil da pagina de dashboard">
        </div>

        <div class="Boas-vindas">
            <h1>Olá User!</h1>
            <p>Você está em <strong>3°</strong> lugar na coleta semanal</p>
        </div>

    </div>

    <div class="planeta">
        <img 
        src="img/planeta.png" 
        alt="foto do planeta em formato de coração">
    </div>
<div class="planta-decorativa1">
<img 
src="img/planta-decorativa.png" 
alt="planta decorativa 1">
</div>
<div class="planta-decorativa2">
<img 
src="img/planta-decorativa2.png" 
alt="planta decorativa 2">

</div>

<div class="card">
    <div class="icone">
        <img 
        src="img/simbolo-reciclagem.jpg" 
        alt="Simbolo do primeiro card">
    </div>
<h2>RESIDUOS COLETADOS</h2>
<p class="valor">245 KG</p>
<div class="crescimento">
    <img 
    src="img/grafico-crescente.jpg" 
    alt="seta crescente do dashboard">
<span>12%</span>
</div>
<p class="descricao">vs semana anterior</p>
</div>

<div class="card">
<div class="icone">
    <img 
    src="img/coletas-realizadas.jpg" 
    alt="caminhao de coletas realizadas">
</div>
<h2>COLETAS REALIZADAS</h2>
<p class="valor">18</p>
    <div class="crescimento">
    <img 
    src="img/grafico-crescente.jpg" 
    alt="grafico crescente do segundo card">
    <span>6%</span>
    <p class="descricao">vs semana anterior</p>
    </div>
</div>

<div class="card">
<div class="icone">
    <img 
    src="img/alvo-meta.jpg" 
    alt="imagem ilustrativa da meta semanal">
</div>
<h2>META SEMANAL</h2>
<p class="valor">70%</p>
<div class="barra-porcentagem">
    <img 
    src="img/barra-porcentagem.jpg" 
    alt="barra de porcentagem da aba de meta semanal">
</div>
<p class="descricao">50kg de 70kg</p>
</div>
</body>
</html>
